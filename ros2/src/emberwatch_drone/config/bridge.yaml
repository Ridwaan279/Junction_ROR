# Explicit ROS 2 <-> Gazebo (Harmonic) bridges. Gazebo topics are NOT ROS topics
# unless listed here. The water-drop emitter is toggled with the gz CLI instead
# because ros_gz_interfaces has no ParticleEmitter message.
- ros_topic_name: /emberwatch/drone/cmd_vel
  gz_topic_name: /model/ember_drone/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: /emberwatch/drone/odom
  gz_topic_name: /model/ember_drone/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
