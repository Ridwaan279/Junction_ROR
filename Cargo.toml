[workspace]
resolver = "2"
members = ["crates/domain", "crates/platform", "crates/server", "crates/intelligence", "crates/response", "crates/firecast"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.100"
publish = false

[workspace.dependencies]
emberwatch-domain = { path = "crates/domain" }
emberwatch-platform = { path = "crates/platform" }
emberwatch-intelligence = { path = "crates/intelligence" }
emberwatch-response = { path = "crates/response" }
emberwatch-firecast = { path = "crates/firecast" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
schemars = { version = "=0.8.22", features = ["chrono", "uuid1"] }
chrono = { version = "=0.4.42", features = ["serde"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "fs", "test-util"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
axum = "=0.8.6"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "uuid", "migrate", "macros"] }
thiserror = "=2.0.17"
sha2 = "=0.10.9"
hmac = "=0.12.1"
hex = "=0.4.3"
futures = "=0.3.31"
tokio-stream = { version = "=0.1.17", features = ["sync"] }
tower = { version = "=0.5.2", features = ["util"] }
tower-http = { version = "=0.6.6", features = ["cors", "trace", "limit"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
anyhow = "=1.0.104"
async-stream = "=0.3.6"
csv = "=1.4.0"
uuid = { version = "=1.29.2", features = ["serde", "v4", "v5"] }
futures-util = "=0.3.34"
unicode-normalization = "=0.1.26"
chrono-tz = "=0.10.4"
