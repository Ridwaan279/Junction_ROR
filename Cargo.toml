[workspace]
resolver = "2"
members = ["crates/domain", "crates/platform", "crates/server", "crates/intelligence", "crates/response"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
emberwatch-domain = { path = "crates/domain" }
emberwatch-platform = { path = "crates/platform" }
emberwatch-intelligence = { path = "crates/intelligence" }
emberwatch-response = { path = "crates/response" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
schemars = { version = "=0.8.22", features = ["chrono"] }
chrono = { version = "=0.4.42", features = ["serde"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json"] }
axum = "=0.8.6"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "migrate", "macros"] }
thiserror = "=2.0.17"
sha2 = "=0.10.9"
hmac = "=0.12.1"
hex = "=0.4.3"
futures = "=0.3.31"
tokio-stream = { version = "=0.1.17", features = ["sync"] }
tower = { version = "=0.5.2", features = ["util"] }
tower-http = { version = "=0.6.6", features = ["cors", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
