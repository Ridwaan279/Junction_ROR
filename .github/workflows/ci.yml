name: Rust platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: emberwatch
          POSTGRES_PASSWORD: emberwatch-local
          POSTGRES_DB: emberwatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emberwatch -d emberwatch"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://emberwatch:emberwatch-local@localhost:5432/emberwatch
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p emberwatch-platform --test postgres --locked -- --ignored
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_contracts.py
      - name: Check generated contracts
        run: |
          cargo run -q -p emberwatch-domain --example export_schema --locked > /tmp/emberwatch-schema.json
          diff -u contracts/schema.json /tmp/emberwatch-schema.json
